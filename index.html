<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b09">
  <meta name="description" content="PlayTrace is a local-first game session tracker. Log playtime, spot your patterns, and keep your streaks alive.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlayTrace">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <title>PlayTrace — Game Session Tracker</title>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-glow ambient-glow--a"></span>
    <span class="ambient-glow ambient-glow--b"></span>
    <span class="ambient-grid"></span>
  </div>

  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-mark">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="45" height="45" rx="14" fill="#c9ff4d"/>
        <path d="M8 26h6.5l3-11 5.5 20 3.5-9H40" stroke="#0b1206" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="boot-word">PlayTrace</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <div class="app-shell" id="app">
    <aside class="rail" id="rail"></aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view" tabindex="-1"></main>
      <footer class="app-footer">
        <span>PlayTrace · local-first session tracking</span>
        <span class="app-footer-dot" aria-hidden="true"></span>
        <span>v1.0</span>
      </footer>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  <div id="live-dock"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">PlayTrace needs JavaScript to track your sessions.</p></noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
